<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SC-300 Practice Quiz</title><style>body{font-family:Segoe UI,Arial;margin:0;background:#f5f7fb;color:#172033}.card{max-width:850px;margin:24px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #0002}.head,.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar{height:9px;background:#e5e7eb;border-radius:9px;margin:18px 0;overflow:hidden}.fill{height:100%;background:#2563eb}.opt{display:block;width:100%;text-align:left;padding:13px;margin:9px 0;border:1px solid #cbd5e1;border-radius:10px;background:white;font-size:16px}.correct{background:#e9f8ed;border:2px solid #15803d}.wrong{background:#fff0f0;border:2px solid #b42318}.feedback{padding:13px;margin-top:15px;border-radius:10px}.good{background:#e9f8ed;color:#166534}.bad{background:#fff0f0;color:#991b1b}.btn{padding:10px 16px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e8edf6}.danger{background:#b42318;color:#fff}.btn:disabled{opacity:.45}.score{font-size:48px;font-weight:800;color:#102a56}@media(max-width:600px){.card{margin:0;min-height:100vh;border-radius:0;padding:18px}.nav .btn{flex:1}}</style></head><body><main id="app" class="card"></main><script>const QUESTION_BANK=[["Which role can manage users and groups without managing other admins?", ["User Administrator", "Global Administrator", "Security Reader", "Billing Administrator"], [0], "User Administrator manages users and groups with less privilege than Global Administrator."], ["Which feature gives users access to SaaS apps with one sign-in?", ["Single sign-on", "Access reviews", "PIM", "Password protection"], [0], "Single sign-on lets users authenticate once and access integrated applications."], ["Which authentication method is phishing-resistant?", ["SMS", "Voice call", "FIDO2 security key", "Security questions"], [2], "FIDO2 security keys use phishing-resistant public-key authentication."], ["Which feature lets users reset their own passwords?", ["SSPR", "PIM", "Entitlement management", "Conditional Access insights"], [0], "Self-service password reset lets users reset passwords without helpdesk intervention."], ["What is required for on-premises password changes to be written back from Entra ID?", ["Password writeback", "Seamless SSO", "Pass-through authentication only", "B2B collaboration"], [0], "Password writeback sends supported cloud password resets to on-premises Active Directory."], ["Which object represents an application in a specific Entra tenant?", ["Service principal", "Administrative unit", "Security group", "Access package"], [0], "A service principal is the local tenant instance of an application."], ["Which object is the global application definition?", ["Application registration", "Service principal", "Managed identity", "Role assignment"], [0], "The application registration defines the application globally; service principals are tenant instances."], ["Which Conditional Access control requires a second verification factor?", ["Require multifactor authentication", "Block legacy authentication only", "Require compliant device only", "Session sign-in frequency"], [0], "Require multifactor authentication enforces an additional authentication factor."], ["Which Conditional Access condition identifies trusted office networks?", ["Named locations", "Authentication contexts", "Terms of use", "Access packages"], [0], "Named locations define trusted or known network locations."], ["What does report-only mode do for Conditional Access?", ["Evaluates impact without enforcement", "Disables logging", "Blocks every user", "Deletes the policy"], [0], "Report-only evaluates policy outcomes without enforcing controls."], ["Which feature provides time-limited elevation to privileged roles?", ["Privileged Identity Management", "Access reviews", "Identity Protection", "Conditional Access"], [0], "PIM enables eligible, time-bound, and approval-based privileged role activation."], ["Which PIM assignment type requires activation before use?", ["Eligible", "Permanent active", "Direct group member", "Guest invitation"], [0], "Eligible assignments require activation to obtain the role."], ["Which PIM setting can require a justification during activation?", ["Activation settings", "Named location", "User flow", "Cross-tenant access"], [0], "PIM activation settings can require justification, MFA, approval, and duration limits."], ["Which feature periodically confirms whether users still need access?", ["Access reviews", "SSPR", "Password hash synchronization", "Authentication strengths"], [0], "Access reviews support recurring validation of memberships, app access, and role assignments."], ["Which feature bundles resources, roles, and approval policies for requestable access?", ["Access package", "Administrative unit", "Dynamic group", "Authentication context"], [0], "Access packages package resources with request, approval, expiration, and review policies."], ["Where are access packages managed?", ["Entitlement management", "Identity Protection", "Defender for Identity", "Exchange admin center"], [0], "Access packages are part of Microsoft Entra entitlement management."], ["Which feature detects risky users and risky sign-ins?", ["Microsoft Entra ID Protection", "PIM", "SSPR", "Cloud Sync"], [0], "Identity Protection detects and investigates identity risks."], ["Which policy can require password change for a risky user?", ["User risk policy", "Named location", "Terms of use", "App consent policy"], [0], "A user risk policy can require secure password change when user risk reaches a configured level."], ["Which policy can require MFA based on sign-in risk?", ["Sign-in risk policy", "Access package policy", "Application proxy policy", "Password protection policy"], [0], "Sign-in risk policies can trigger controls such as MFA for risky sign-ins."], ["Which report shows accounts currently considered risky?", ["Risky users", "Provisioning logs", "Sign-in frequency", "License details"], [0], "The Risky users report shows detected user risk and status."], ["Which hybrid authentication method validates passwords against on-premises agents?", ["Pass-through authentication", "Password hash synchronization", "Federation metadata only", "B2B direct connect"], [0], "Pass-through authentication validates credentials through on-premises authentication agents."], ["Which hybrid authentication method stores a derived password hash in Entra ID?", ["Password hash synchronization", "Pass-through authentication", "AD FS only", "Application Proxy"], [0], "Password hash synchronization synchronizes a derived password hash to Entra ID."], ["Which feature enables silent sign-in on corporate devices with hybrid identity?", ["Seamless SSO", "Access review", "PIM", "Lifecycle workflow"], [0], "Seamless SSO can sign users in automatically on corporate networks."], ["Which agent represents an on-premises server as an Azure resource?", ["Azure Connected Machine agent", "Azure File Sync agent", "Application Proxy connector", "Provisioning agent"], [0], "The Azure Connected Machine agent onboards a server to Azure Arc."], ["Which feature publishes an on-premises web app without opening inbound firewall ports?", ["Microsoft Entra Application Proxy", "B2B collaboration", "PIM", "Access reviews"], [0], "Application Proxy uses outbound connectors to securely publish on-premises web applications."], ["Which identity type removes the need to store credentials in application code?", ["Managed identity", "Guest account", "Emergency access account", "Synced user"], [0], "Managed identities provide Azure resources with automatically managed identities."], ["Which managed identity can be shared by multiple Azure resources?", ["User-assigned managed identity", "System-assigned managed identity", "Guest identity", "Device identity"], [0], "A user-assigned managed identity is an independent resource reusable by multiple Azure resources."], ["What happens to a system-assigned managed identity when its Azure resource is deleted?", ["The identity is deleted", "It becomes a guest", "It converts to user-assigned", "It remains permanently"], [0], "A system-assigned identity shares the lifecycle of its parent Azure resource."], ["Which protocol is commonly used for modern delegated API authorization?", ["OAuth 2.0", "LDAP", "Kerberos only", "RADIUS"], [0], "OAuth 2.0 provides delegated authorization for applications and APIs."], ["Which protocol adds an identity layer on top of OAuth 2.0?", ["OpenID Connect", "SAML only", "SCIM", "WS-Trust"], [0], "OpenID Connect adds authentication and identity claims to OAuth 2.0."], ["Which protocol commonly exchanges XML assertions for enterprise SSO?", ["SAML", "SCIM", "OAuth device code only", "LDAP sync"], [0], "SAML uses XML assertions for authentication and SSO."], ["Which standard is used to provision users and groups to SaaS applications?", ["SCIM", "SAML", "FIDO2", "Kerberos"], [0], "SCIM standardizes identity provisioning and deprovisioning."], ["Which log shows application provisioning operations?", ["Provisioning logs", "Risky users", "Audit only for devices", "PIM alerts only"], [0], "Provisioning logs show actions performed by the provisioning service."], ["Which log shows authentication attempts?", ["Sign-in logs", "Provisioning logs", "Access review history only", "License audit"], [0], "Sign-in logs record authentication events and related details."], ["Which log shows directory configuration changes?", ["Audit logs", "Sign-in logs", "Risk detections only", "Usage reports"], [0], "Audit logs record changes to users, groups, apps, policies, and other directory objects."], ["Which group can automatically update membership from user attributes?", ["Dynamic group", "Assigned group only", "Mail contact", "Administrative unit"], [0], "Dynamic groups evaluate membership rules based on user or device attributes."], ["Can a dynamic group membership rule directly use another group as a nested member?", ["No", "Yes, always", "Only for guests", "Only with PIM"], [0], "Dynamic membership rules evaluate supported attributes rather than ordinary nested-group membership."], ["Which feature delegates user administration for only part of the organization?", ["Administrative units", "Named locations", "Authentication strengths", "Access packages"], [0], "Administrative units scope supported administrative roles to a subset of directory objects."], ["Which account type should be maintained for tenant recovery emergencies?", ["Emergency access account", "Daily Global Administrator account", "Guest account", "Managed identity"], [0], "Emergency access accounts provide a recovery path when normal administrator access fails."], ["Which best practice reduces standing Global Administrator access?", ["Use PIM eligible assignments", "Assign all admins permanently", "Share one admin account", "Disable audit logs"], [0], "Eligible, time-limited PIM activation reduces standing privilege."], ["Which feature can block commonly used weak passwords and custom organization terms?", ["Microsoft Entra Password Protection", "Application Proxy", "Access reviews", "Cross-tenant sync"], [0], "Password Protection applies global and custom banned-password lists."], ["Which authentication feature allows policies to require phishing-resistant methods?", ["Authentication strengths", "Named locations", "Access packages", "Administrative units"], [0], "Authentication strengths specify acceptable combinations of authentication methods."], ["Which feature can limit a session in unmanaged devices for supported cloud apps?", ["Conditional Access session controls", "PIM approval", "Password writeback", "Dynamic groups"], [0], "Conditional Access session controls can apply restrictions to supported application sessions."], ["Which control requires an Intune-managed device to meet compliance rules?", ["Require device to be marked compliant", "Require password change", "Require terms of use only", "Require guest invitation"], [0], "The compliant-device grant control uses device compliance status from Intune."], ["Which control requires the device to be joined to on-premises AD and registered in Entra ID?", ["Require Microsoft Entra hybrid joined device", "Require approved client app", "Require MFA registration", "Require sign-in frequency"], [0], "Hybrid joined devices are joined to Active Directory and registered with Entra ID."], ["Which setting governs whether users can consent to app permissions?", ["User consent settings", "SSPR settings", "PIM notifications", "Named locations"], [0], "User consent settings define whether and under what conditions users may grant app consent."], ["Which workflow lets users request admin approval for app consent?", ["Admin consent workflow", "Access review", "Lifecycle workflow", "Password reset"], [0], "The admin consent workflow routes unsupported user consent requests to designated reviewers."], ["Which policy type controls which apps and permissions users may consent to?", ["App consent policy", "Authentication strength", "Sign-in risk policy", "Terms of use"], [0], "App consent policies define allowed consent conditions."], ["Which feature automates joiner, mover, and leaver tasks?", ["Lifecycle Workflows", "Named locations", "Application Proxy", "PIM alerts"], [0], "Lifecycle Workflows automates identity lifecycle tasks for joiners, movers, and leavers."], ["Which feature synchronizes selected users across Microsoft Entra tenants?", ["Cross-tenant synchronization", "Password writeback", "Seamless SSO", "Banned password list"], [0], "Cross-tenant synchronization automates B2B user provisioning between tenants."]];let q=QUESTION_BANK,order=[],pos=0,answers={},checked={};const app=document.getElementById('app');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function score(){return Object.entries(answers).filter(([k,v])=>String(q[+k][2].sort())===String(v.sort())).length}
function render(){let qi=order[pos],x=q[qi],chosen=answers[qi],done=checked[qi];app.innerHTML=`<div class="head"><b>SC-300 Practice Quiz</b><span>Question ${pos+1} of ${q.length}</span></div><div class="bar"><div class="fill" style="width:${(pos+1)/q.length*100}%"></div></div><h2>${x[0]}</h2><div id="opts"></div><div id="fb"></div><p>${Object.keys(checked).length} answered · ${score()} correct</p><div class="nav"><button class="btn secondary" id="prev" ${pos===0?'disabled':''}>Previous</button><button class="btn danger" id="end">End quiz</button><button class="btn primary" id="next" ${!done?'disabled':''}>${pos===q.length-1?'Finish':'Next'}</button></div>`;let box=document.getElementById('opts');x[1].forEach((t,i)=>{let b=document.createElement('button');b.className='opt'+(done&&x[2].includes(i)?' correct':'')+(done&&chosen.includes(i)&&!x[2].includes(i)?' wrong':'');b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${t}`;b.onclick=()=>{if(!done){answers[qi]=[i];checked[qi]=true;render()}};box.appendChild(b)});if(done){let ok=String(x[2].sort())===String(chosen.sort()),f=document.getElementById('fb');f.className='feedback '+(ok?'good':'bad');f.innerHTML=`<b>${ok?'Correct':'Incorrect'}</b>${ok?'':`<p>Correct answer: ${x[2].map(i=>String.fromCharCode(65+i)+'. '+x[1][i]).join('<br>')}</p>`}<p>${x[3]}</p>`}document.getElementById('prev').onclick=()=>{pos--;render()};document.getElementById('next').onclick=()=>{if(pos===q.length-1)end();else{pos++;render()}};document.getElementById('end').onclick=end}
function end(){let n=Object.keys(checked).length,s=score(),pct=n?Math.round(s/n*100):0;app.innerHTML=`<h1>Quiz results</h1><div class="score">${s}/${n}</div><p>${n?`${pct}% correct from ${n} answered questions.`:'No questions answered.'}</p><button class="btn primary" id="restart">Start new shuffled quiz</button>`;document.getElementById('restart').onclick=start}
function start(){order=shuffle(q.map((_,i)=>i));pos=0;answers={};checked={};render()}start();</script></body></html>
